[project]
name = "audit-agent"
version = "1.0.0"
description = "Autonomous Security & Compliance Agent with Empirical Proof-of-Concept Verification"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "franca roscilli", email = "francaroscillidev@gmail.com" }
]
keywords = [
    "security",
    "smart-contracts",
    "solidity",
    "audit",
    "fuzzing",
    "sast",
    "agent",
    "llm",
    "foundry",
    "web3",
    "defi",
    "cwe",
    "owasp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/francaroscillidev-gif/audit-agent"
Documentation = "https://github.com/francaroscillidev-gif/audit-agent#readme"
Repository = "https://github.com/francaroscillidev-gif/audit-agent.git"
Issues = "https://github.com/francaroscillidev-gif/audit-agent/issues"

[project.scripts]
audit-agent = "audit_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
