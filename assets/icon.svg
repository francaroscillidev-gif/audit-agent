<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#111f38"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>

    <!-- Metallic Edge Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Shield Outer Gradient -->
    <linearGradient id="shieldOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Cyber Cyan to Emerald -->
    <linearGradient id="cyberCyanEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Core Lock Glow -->
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGlow)" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Ambient Background Ambient Light -->
  <circle cx="256" cy="220" r="160" fill="#00f2fe" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="256" cy="290" r="140" fill="#10b981" opacity="0.06" filter="url(#softGlow)"/>

  <!-- Circuit Pattern Background (Left) -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.25">
    <path d="M 80 180 L 140 180 L 170 210 L 190 210" fill="none"/>
    <circle cx="80" cy="180" r="4" fill="#00f2fe"/>
    <circle cx="190" cy="210" r="3" fill="#00f2fe"/>

    <path d="M 90 270 L 130 270 L 155 245 L 180 245" fill="none"/>
    <circle cx="90" cy="270" r="3" fill="#00f2fe"/>
    
    <path d="M 110 340 L 160 340 L 195 305 L 210 305" fill="none"/>
    <circle cx="110" cy="340" r="4" fill="#00f2fe"/>
  </g>

  <!-- Circuit Pattern Background (Right) -->
  <g stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.25">
    <path d="M 432 180 L 372 180 L 342 210 L 322 210" fill="none"/>
    <circle cx="432" cy="180" r="4" fill="#34d399"/>
    <circle cx="322" cy="210" r="3" fill="#34d399"/>

    <path d="M 422 270 L 382 270 L 357 245 L 332 245" fill="none"/>
    <circle cx="422" cy="270" r="3" fill="#34d399"/>
    
    <path d="M 402 340 L 352 340 L 317 305 L 302 305" fill="none"/>
    <circle cx="402" cy="340" r="4" fill="#34d399"/>
  </g>

  <!-- Cyber Shield Outer Layer -->
  <path d="M 256 70 
           C 330 70, 395 105, 410 175 
           C 415 270, 345 375, 256 438 
           C 167 375, 97 270, 102 175 
           C 117 105, 182 70, 256 70 Z" 
        fill="url(#shieldOuter)" 
        stroke="url(#cyberCyanEmerald)" 
        stroke-width="5" 
        filter="url(#neonBloom)"/>

  <!-- Cyber Shield Inner Plate -->
  <path d="M 256 94 
           C 316 94, 370 122, 384 180 
           C 388 258, 332 346, 256 405 
           C 180 346, 124 258, 128 180 
           C 142 122, 196 94, 256 94 Z" 
        fill="#070b14" 
        stroke="#1e293b" 
        stroke-width="3" 
        opacity="0.9"/>

  <!-- Geometric Tech Facets -->
  <path d="M 256 94 L 256 405" stroke="url(#cyberCyanEmerald)" stroke-width="1.5" opacity="0.3"/>
  <path d="M 128 180 L 256 250 L 384 180" stroke="url(#cyberCyanEmerald)" stroke-width="1.5" opacity="0.25"/>

  <!-- Central Proof Verification Badge & Lock Structure -->
  <!-- Lock Shackle -->
  <path d="M 216 220 
           L 216 185 
           C 216 162.9, 233.9 145, 256 145 
           C 278.1 145, 296 162.9, 296 185 
           L 296 220" 
        fill="none" 
        stroke="url(#cyberCyanEmerald)" 
        stroke-width="14" 
        stroke-linecap="round" 
        filter="url(#neonBloom)"/>

  <!-- Central Tech Hexagon Core -->
  <polygon points="256,205 316,240 316,308 256,343 196,308 196,240" 
           fill="#0b1329" 
           stroke="url(#cyberCyanEmerald)" 
           stroke-width="4" 
           filter="url(#neonBloom)"/>

  <!-- Empirical Proof Checkmark Symbol (Verified Status) -->
  <path d="M 226 274 
           L 247 295 
           L 288 250" 
        fill="none" 
        stroke="url(#emeraldGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#neonBloom)"/>

  <!-- Orbital Data Satellites (Logic Invariant Verification Points) -->
  <circle cx="256" cy="94" r="5" fill="#00f2fe" filter="url(#neonBloom)"/>
  <circle cx="384" cy="180" r="4" fill="#38bdf8"/>
  <circle cx="128" cy="180" r="4" fill="#38bdf8"/>
  <circle cx="256" cy="405" r="5" fill="#10b981" filter="url(#neonBloom)"/>
</svg>
